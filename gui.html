<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Leaderboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1b1b2f;
            color: #fff;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #0f3460;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2rem;
        }

        .leaderboard-container {
            max-width: 800px;
            margin: 30px auto;
            background-color: #162447;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #1f4068;
        }

        tr:nth-child(even) {
            background-color: #1b1b2f;
        }

        tr:hover {
            background-color: #0f3460;
        }

        .rank {
            font-weight: bold;
        }

        .score {
            color: #e94560;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 15px;
            background-color: #0f3460;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        .add-player {
            margin: 20px 0;
            text-align: center;
        }

        .add-player input, .add-player button {
            padding: 10px;
            font-size: 1rem;
            margin: 5px;
            border-radius: 5px;
            border: none;
        }

        .add-player button {
            background-color: #e94560;
            color: white;
            cursor: pointer;
        }

        .add-player button:hover {
            background-color: #ff2e63;
        }

    </style>
</head>
<body>

    <header>
        <h1>Gaming Leaderboard</h1>
    </header>

    <div class="leaderboard-container">

        <div class="add-player">
            <input type="text" placeholder="Player Name" id="playerName">
            <input type="number" placeholder="Score" id="playerScore">
            <button onclick="addPlayer()">Add Player</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Player Name</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody id="leaderboard">
                <!-- Player rows will appear here dynamically -->
            </tbody>
        </table>
    </div>

    <footer>
        &copy; 2025 Gaming Leaderboard
    </footer>

    <script>
        const leaderboard = document.getElementById('leaderboard');

        let players = [
            {name: "Alice", score: 1500},
            {name: "Bob", score: 1200},
            {name: "Charlie", score: 1000}
        ];

        function displayLeaderboard() {
            leaderboard.innerHTML = '';
            players.sort((a,b) => b.score - a.score);
            players.forEach((player, index) => {
                leaderboard.innerHTML += `
                    <tr>
                        <td class="rank">${index + 1}</td>
                        <td>${player.name}</td>
                        <td class="score">${player.score}</td>
                    </tr>
                `;
            });
        }

        function addPlayer() {
            const name = document.getElementById('playerName').value;
            const score = parseInt(document.getElementById('playerScore').value);
            if(name && !isNaN(score)) {
                players.push({name, score});
                displayLeaderboard();
                document.getElementById('playerName').value = '';
                document.getElementById('playerScore').value = '';
            } else {
                alert("Please enter valid name and score");
            }
        }

        displayLeaderboard();
    </script>

</body>
</html>
